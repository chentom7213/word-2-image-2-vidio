name: benchu-canvas

# Optional single-machine tracing overlay. It is not part of the default project.
# Start it only together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# `docker compose up` alone does not create these containers.

x-logging: &observability-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-20m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-5}
    compress: "true"

services:
  api:
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      otel-collector:
        condition: service_started

  # Tempo's image runs as uid 10001, while a new named volume is root-owned.
  tempo-init:
    image: alpine:3.20
    user: "0:0"
    restart: "no"
    logging: *observability-logging
    read_only: true
    cpus: ${TEMPO_INIT_CPU_LIMIT:-0.25}
    mem_limit: ${TEMPO_INIT_MEMORY_LIMIT:-128m}
    pids_limit: ${TEMPO_INIT_PIDS_LIMIT:-64}
    command: ["sh", "-c", "mkdir -p /var/tempo/wal /var/tempo/blocks && chown -R 10001:10001 /var/tempo"]
    volumes:
      - tempo-data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector:0.163.2
    restart: unless-stopped
    logging: *observability-logging
    cpus: ${OTEL_COLLECTOR_CPU_LIMIT:-0.5}
    mem_limit: ${OTEL_COLLECTOR_MEMORY_LIMIT:-512m}
    pids_limit: ${OTEL_COLLECTOR_PIDS_LIMIT:-128}
    command: ["--config", "/etc/otelcol/config.yaml"]
    environment:
      GOMEMLIMIT: 400MiB
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.10.10
    user: "10001:10001"
    restart: unless-stopped
    logging: *observability-logging
    cpus: ${TEMPO_CPU_LIMIT:-0.5}
    mem_limit: ${TEMPO_MEMORY_LIMIT:-768m}
    pids_limit: ${TEMPO_PIDS_LIMIT:-256}
    command: ["-config.file=/etc/tempo.yaml"]
    environment:
      GOMEMLIMIT: 640MiB
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_QUERY_PORT:-3200}:3200"
    depends_on:
      tempo-init:
        condition: service_completed_successfully

volumes:
  tempo-data:
