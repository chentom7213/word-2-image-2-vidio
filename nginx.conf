log_format safe '$remote_addr [$time_local] request_id=$request_id '
                '"$request_method $uri $server_protocol" $status '
                '$body_bytes_sent rt=$request_time urt=$upstream_response_time';
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/snippets/security-headers.conf;
  access_log /var/log/nginx/access.log safe;
  # Request-level nginx errors include the raw request target. Keep only
  # critical process failures so signed media/SSE query credentials never land.
  error_log /var/log/nginx/error.log crit;
  limit_req_status 429;

  # Multipart payloads are capped slightly above Fastify's 50 MiB file limit.
  client_max_body_size 60m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # SSE is the only API path that should disable all response buffering.
  location ~ ^/api/generations/[^/]+/stream$ {
    limit_req zone=api_per_ip burst=60 nodelay;
    limit_conn connections_per_ip 20;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 930s;
    proxy_send_timeout 30s;
  }

  # ── API ────────────────────────────────────────────────────────────────
  location /api/ {
    limit_req zone=api_per_ip burst=100 nodelay;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  # ── API 内部端点不下发到公网 ────────────────────────────────────────────
  location = /api/metrics { return 403; }

  # ── 签名产物 / 上传 ────────────────────────────────────────────────────
  location /media/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # ── 静态资源缓存 ───────────────────────────────────────────────────────
  location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
