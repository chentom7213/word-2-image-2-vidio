apiVersion: v1
kind: Namespace
metadata:
  name: benchu
  labels:
    app.kubernetes.io/part-of: benchu-canvas
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: benchu-api-config
  namespace: benchu
data:
  # Non-secret runtime configuration. Secrets live in `benchu-secrets`.
  HOST: '0.0.0.0'
  PORT: '4000'
  NODE_ENV: 'production'
  LOG_JSON: 'true'
  LOG_LEVEL: 'info'

  DB_HOST: 'mysql.benchu.svc.cluster.local'
  DB_PORT: '3306'
  DB_NAME: 'benchu_canvas'

  REDIS_HOST: 'redis.benchu.svc.cluster.local'
  REDIS_PORT: '6379'
  QUEUE_ENABLED: 'true'
  QUEUE_STREAM: 'gen:tasks'
  QUEUE_GROUP: 'workers'

  # API pods must NOT consume the queue; workers scale independently.
  EMBEDDED_WORKER: 'false'
  WORKER_CONCURRENCY: '2'

  JWT_ACCESS_EXPIRES_IN: '15m'
  JWT_REFRESH_DAYS: '7'
  REFRESH_COOKIE_SECURE: 'true'

  UPLOAD_DIR: '/data/uploads'
  OUTPUT_DIR: '/data/storage'
  STORAGE_SIGN_TTL: '3600'

  FFMPEG_PATH: 'ffmpeg'
  RENDER_MAX_PIXELS: '409600'
  RENDER_FPS: '12'
  RENDER_TIMEOUT_MS: '120000'

  STALE_TASK_MINUTES: '10'
  REAPER_INTERVAL_MS: '60000'

  MODERATION_ENABLED: 'true'

  CORS_ORIGIN: 'https://app.example.com'
---
apiVersion: v1
kind: Secret
metadata:
  name: benchu-secrets
  namespace: benchu
type: Opaque
stringData:
  # Replace with values from your KMS / sealed-secrets controller. These are
  # placeholders so a reviewer can see exactly which keys are required.
  DB_USER: 'benchu'
  DB_PASSWORD: 'REPLACE_ME'
  JWT_SECRET: 'REPLACE_ME_WITH_KMS'
  STORAGE_SIGN_SECRET: 'REPLACE_ME_WITH_KMS'
  METRICS_TOKEN: 'REPLACE_ME'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchu-api
  namespace: benchu
  labels:
    app.kubernetes.io/name: benchu-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: benchu-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: benchu-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: registry.example.com/benchu/canvas-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: benchu-api-config
            - secretRef:
                name: benchu-secrets
          # Liveness must not depend on MySQL: a DB blip must not restart pods.
          livenessProbe:
            httpGet: { path: /api/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness DOES depend on the DB: stop routing traffic, keep the pod.
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /api/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: artifacts
              mountPath: /data
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: benchu-artifacts
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: benchu-artifacts
  namespace: benchu
spec:
  accessModes: ['ReadWriteMany']
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: benchu
spec:
  selector:
    app.kubernetes.io/name: benchu-api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchu-worker
  namespace: benchu
  labels:
    app.kubernetes.io/name: benchu-worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: benchu-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: benchu-worker
    spec:
      # Render work is CPU/GPU-heavy; give workers room and keep them off the
      # API nodes so a render spike cannot starve request handling.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: registry.example.com/benchu/canvas-worker:latest
          envFrom:
            - configMapRef:
                name: benchu-api-config
            - secretRef:
                name: benchu-secrets
          env:
            - name: WORKER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: '1'
              memory: 1Gi
            limits:
              cpu: '4'
              memory: 3Gi
          volumeMounts:
            - name: artifacts
              mountPath: /data
          # Workers are queue-driven; no probes. A stuck pod is caught by the
          # heartbeat reaper in the API, which fails + refunds the task.
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: benchu-artifacts
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: benchu-api
  namespace: benchu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: benchu-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Render-heavy traffic is bursty; do not thrash.
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: benchu-worker
  namespace: benchu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: benchu-worker
  minReplicas: 2
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: benchu-api
  namespace: benchu
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: benchu-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: benchu
  namespace: benchu
  annotations:
    nginx.ingress.kubernetes.io/ssl-protocols: 'TLSv1.2 TLSv1.3'
    nginx.ingress.kubernetes.io/proxy-body-size: '60m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '900'
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: ['app.example.com']
      secretName: benchu-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
